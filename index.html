<style>
  :root{
    --bg: #EAF3FF;
    --surface: #FFFFFF;
    --surface-sunken: #DEECFC;
    --ink: #152238;
    --ink-soft: #55698A;
    --ink-faint: #93A4C2;
    --line: #D3E3F7;
    --accent: #2F80FF;
    --accent-soft: #E4EFFF;
    --grow: #00B87C;
    --grow-soft: #DEF9EC;
    --spend: #F2523D;
    --spend-soft: #FDE6E2;
    --gold: #FFB300;
    --gold-soft: #FFF1CE;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(21,34,56,0.06), 0 8px 24px rgba(21,34,56,0.06);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }
  body{ margin:0; }

  .app{
    background: var(--bg);
    background-image:
      repeating-linear-gradient(to bottom, transparent, transparent 39px, rgba(21,34,56,0.035) 40px);
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  @media (display-mode: standalone){
    .topbar{ padding-top: calc(18px + env(safe-area-inset-top)); }
    .app{ padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  }

  .topbar{
    position: sticky; top:0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 0;
  }
  .topbar-inner{ max-width: 760px; margin: 0 auto; }
  .brand-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .brand{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .brand h1{
    font-family: var(--font-display); font-size: 22px; font-weight:700; margin:0;
    letter-spacing: -0.01em;
  }
  .brand-icon{
    width: 28px; height: 28px; flex-shrink:0; align-self:center;
  }
  .brand .tag{ color: var(--ink-faint); font-size: 13px; }
  .profile-name{
    font-size: 13px; font-weight:600; color: var(--ink-soft); white-space:nowrap;
    padding-top: 4px;
  }

  .tabs{ display:flex; gap: 4px; }
  .tab{
    font-family: var(--font-body); font-weight:600; font-size: 14.5px;
    background:none; border:none; cursor:pointer;
    color: var(--ink-soft); padding: 10px 4px 12px; margin-right: 22px;
    border-bottom: 2px solid transparent; position:relative; top:1px;
  }
  .tab.active{ color: var(--accent); border-bottom-color: var(--accent); }

  .subtabs{
    display:flex; gap:8px; max-width:760px; padding: 10px 20px; margin: 0 auto;
    position: sticky; top: var(--topbar-height, 110px); z-index: 15;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .subtab{
    font-family: var(--font-body); font-weight:600; font-size: 13.5px;
    background: var(--surface); border: 1px solid var(--line); cursor:pointer;
    color: var(--ink-soft); padding: 7px 14px; border-radius: 999px;
  }
  .subtab.active{ background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

  main{ max-width: 760px; margin: 0 auto; padding: 4px 20px 40px; }

  .card{
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 22px; margin-bottom: 16px;
  }
  .card h2{ font-family:var(--font-display); font-size:16px; margin:0 0 14px; letter-spacing:-0.01em; }
  .section-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .section-head h2{ margin:0; }
  .card h3{ font-family:var(--font-display); font-size:14px; margin:0 0 10px; }

  .period-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .period-nav .period-label{ font-family: var(--font-display); font-size: 17px; font-weight:600; }
  .period-nav .period-sub{ display:block; font-family: var(--font-body); font-weight:400; font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
  .navbtn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    cursor:pointer; font-size:15px; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .navbtn:hover{ background: var(--surface-sunken); }
  .nav-arrows{ display:flex; gap:6px; }

  .summary-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:120px; }
  .stat .label{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px;}
  .stat .value{ font-family:var(--font-mono); font-size:19px; font-weight:600; }
  .stat .value.grow{ color:var(--grow); }
  .stat .value.spend{ color:var(--spend); }

  .cat-card{ border:1px solid var(--line); border-radius: 10px; padding:16px 18px; margin-bottom:12px; }
  .cat-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .cat-name{ font-weight:600; font-size:14.5px; }
  .cat-budget{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); }
  .cat-actions{ display:flex; gap:6px; align-items:center; }
  .link-badge{
    font-size:10.5px; background:var(--accent-soft); color:var(--accent); padding:2px 8px;
    border-radius:999px; margin-left:4px; font-weight:600; white-space:nowrap;
  }

  .iconbtn{
    background:none; border:none; cursor:pointer; color: var(--ink-faint); font-size:13px;
    padding:4px 6px; border-radius:6px;
  }
  .iconbtn:hover{ background: var(--surface-sunken); color: var(--ink); }

  .runway{ position:relative; height:22px; background:var(--surface-sunken); border-radius:6px; margin: 8px 0 6px; overflow:visible; }
  .runway-fill{ position:absolute; top:0; left:0; height:100%; border-radius:6px; transition: width .2s ease; }
  .runway-fill.grow{ background: var(--grow); }
  .runway-fill.spend{ background: var(--spend); }
  .runway-pace{ position:absolute; top:-4px; bottom:-4px; width:2px; background: var(--ink); opacity:0.55; }
  .runway-pace::after{
    content:'today'; position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    font-size:9.5px; color: var(--ink-faint); white-space:nowrap; font-family:var(--font-body);
  }

  .cat-foot{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; margin-top:4px; }
  .pace-status{ font-weight:600; }
  .pace-status.grow{ color:var(--grow); }
  .pace-status.spend{ color:var(--spend); }

  .cat-total{ font-family:var(--font-mono); font-size:16px; font-weight:600; text-align:right; }

  .mini-period{ background:var(--surface-sunken); border-radius:9px; padding:12px 14px; margin-top:10px; }
  .mini-period-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:2px; flex-wrap:wrap; }
  .mini-period-label{ font-weight:600; font-size:12.5px; }

  .expense-list{ margin-top:10px; display:flex; flex-direction:column; }
  .expense-row{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft);
    padding:6px 0; border-bottom:1px dashed var(--line);
  }
  .expense-row .note{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .expense-date{ color:var(--ink-faint); font-size:11px; }
  .expense-row .amt{ font-family:var(--font-mono); color:var(--ink); }

  .add-toggle.small{
    padding:6px 10px; font-size:12px; margin-top:8px; width:auto; display:inline-flex;
  }

  .amount-input{
    font-family: var(--font-mono); font-size:13.5px; width:90px; padding:6px 8px;
    border:1px solid var(--line); border-radius:7px; text-align:right; background: var(--bg);
  }
  .amount-input:focus{ outline:2px solid var(--grow); outline-offset:1px; }

  .row-inline{ display:flex; align-items:center; gap:8px; }

  .add-form{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top: 6px;
    background: var(--surface-sunken); padding:12px; border-radius:10px;
  }
  .add-form input[type="text"], .add-form input[type="date"]{ flex:1; min-width:120px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-family:var(--font-body); font-size:13.5px;}
  .add-form input[type="number"]{ width:110px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-family:var(--font-mono); font-size:13.5px;}
  .add-form select{ padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-family:var(--font-body); font-size:13px; }

  .btn{
    font-family: var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer;
    border-radius:8px; padding:9px 15px; border:1px solid var(--accent); background:var(--accent); color:#FFFFFF;
  }
  .btn:hover{ opacity:0.9; }
  .btn.secondary{ background:var(--surface); color:var(--ink); border-color:var(--line); }
  .btn.small{ padding:6px 11px; font-size:12.5px; }
  .btn.full{ width:100%; }

  .add-toggle{
    display:flex; align-items:center; gap:6px; font-weight:600; font-size:13.5px; color:var(--grow);
    background:none; border:1px dashed var(--grow); border-radius:9px; padding:9px 12px; cursor:pointer; width:100%;
    justify-content:center;
  }
  .add-toggle:hover{ background: var(--grow-soft); }

  .empty{ text-align:center; padding: 26px 10px; color: var(--ink-soft); }
  .empty .big{ font-family:var(--font-display); font-size:15px; color:var(--ink); margin-bottom:4px; }
  .empty .small{ font-size:13px; color:var(--ink-faint); }

  .field-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1; min-width:140px; }
  .field label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    font-family:var(--font-mono); font-size:13.5px; background:var(--bg);
  }

  .goal-toggle-row{ display:flex; align-items:center; gap:8px; margin-bottom: 10px; }
  .goal-toggle-row input[type=checkbox]{ width:16px; height:16px; }
  .goal-toggle-row label{ font-size:13.5px; font-weight:600; }

  .savings-ledger{ display:flex; flex-direction:column; gap:2px; }
  .savings-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line);
  }
  .tag-plus{ color:var(--grow); font-weight:700; }
  .tag-minus{ color:var(--spend); font-weight:700; }

  .chart-wrap{ position:relative; height:220px; margin-bottom:14px; }

  .suggestion{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
  .suggestion button{
    background:none; border:none; color:var(--grow); font-weight:600; cursor:pointer; padding:0;
    text-decoration:underline; font-size:12.5px; margin-left:4px;
  }

  .calendar{ background:var(--surface-sunken); border-radius:10px; padding:14px; }
  .cal-head{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px; }
  .cal-dow{ text-align:center; font-size:10.5px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:7px;
    border:1px solid transparent; background:var(--surface); font-family:var(--font-mono); font-size:12px;
    cursor:pointer; color:var(--ink);
  }
  .cal-cell:hover:not(.disabled):not(.empty){ border-color:var(--accent); }
  .cal-cell.selected{ background:var(--accent); color:#FFFFFF; font-weight:600; }
  .cal-cell.disabled{ color:var(--ink-faint); background:transparent; cursor:default; opacity:0.4; }
  .cal-cell.empty{ background:transparent; cursor:default; }
  .cal-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:10px; text-align:center; }

  footer.settings{ max-width:760px; margin: 30px auto 0; padding: 0 20px; text-align:center; }
  footer.settings button{
    background:none; border:none; color:var(--ink-faint); font-size:12px; cursor:pointer; text-decoration:underline;
  }

  .welcome-overlay{
    position:fixed; inset:0; z-index:100;
    background:
      radial-gradient(circle at 20% 15%, rgba(242,102,42,0.14) 0%, rgba(242,102,42,0) 45%),
      radial-gradient(circle at 85% 85%, rgba(31,138,95,0.14) 0%, rgba(31,138,95,0) 45%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .welcome-card{ max-width:400px; width:100%; text-align:center; }
  .welcome-logo{ width:104px; height:104px; margin:0 auto 20px; display:block; filter: drop-shadow(0 6px 16px rgba(21,34,56,0.15)); }
  .welcome-card h1{ font-family:var(--font-display); font-size:21px; margin:0 0 8px; letter-spacing:-0.01em; }
  .welcome-card p{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; line-height:1.5; }
  .welcome-card .add-form{ background:none; padding:0; justify-content:center; }
  .welcome-card input[type="text"]{ text-align:center; }
  .welcome-card .change-name{
    display:inline-block; margin-top:14px; font-size:12px; color:var(--ink-faint);
    text-decoration:underline; background:none; border:none; cursor:pointer;
  }

  @media (max-width: 520px){
    .plan-row{ grid-template-columns: 1fr 80px 80px 70px; font-size:12px; }
    .summary-row{ gap:10px; }
    .brand .tag{ display:none; }
    .savings-row{ flex-wrap:wrap; }
  }
</style>
</head>

(function(){
  "use strict";

  // ---------- Storage ----------
  // Data lives in Firestore, keyed by the signed-in Google account's UID, so it
  // follows you across devices. A localStorage copy is kept as an instant-load
  // cache and an offline fallback.
  const STORAGE_KEY = 'frugalfox-tracker-state-v2';
  let currentUser = null;

  async function loadStateForUser(uid){
    try{
      const snap = await getDoc(doc(db, 'trackers', uid));
      if(snap.exists() && snap.data().json){
        const parsed = normalizeState(JSON.parse(snap.data().json));
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); }catch(e){}
        return parsed;
      }
    }catch(e){ console.error('Cloud load failed, falling back to local cache', e); }
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return normalizeState(JSON.parse(raw));
    }catch(e){ /* nothing cached locally either */ }
    return defaultState();
  }

  let saveTimer = null;
  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
      if(currentUser){
        try{
          await setDoc(doc(db, 'trackers', currentUser.uid), {
            json: JSON.stringify(state), updatedAt: serverTimestamp()
          });
        }catch(e){ console.error('Cloud save failed', e); }
      }
    }, 400);
  }

  const LEGACY_SAVINGS_COLUMN_SIGN = { moneyIn:1, extraIn:1, rent:-1, extraOut:-1, nonCC:-1, cc:-1, interest:1 };

  function defaultGroups(){
    return [
      { key:'rent', label:'Rent', cycleStartDay: 1 },
      { key:'bills', label:'Bills', cycleStartDay: 1 },
      { key:'everyday', label:'Everyday spending', cycleStartDay: 1 }
    ];
  }

  function defaultSavingsColumns(){
    return [
      { key:'moneyIn', label:'Money In', sign: 1 },
      { key:'extraIn', label:'Extra In', sign: 1 },
      { key:'rent', label:'Rent', sign: -1 },
      { key:'extraOut', label:'Extra Out', sign: -1 },
      { key:'nonCC', label:'Non-credit card spending', sign: -1 },
      { key:'cc', label:'Credit card spending', sign: -1 },
      { key:'interest', label:'Interest', sign: 1 }
    ];
  }

  function normalizeState(s){
    if(!s.profile) s.profile = { name: '' };
    if(!s.entries) s.entries = {};
    if(!s.monthly) s.monthly = { income:0, categories:[], groups:[] };
    if(!s.monthly.groups || !s.monthly.groups.length) s.monthly.groups = defaultGroups();
    s.monthly.groups.forEach(g=>{ if(!g.cycleStartDay) g.cycleStartDay = 1; });
    if(!s.weekly) s.weekly = { categories: [], weeks: {} };
    if(!s.weekly.startDay && s.weekly.startDay !== 0) s.weekly.startDay = 1;
    if(!s.weekly.splits) s.weekly.splits = {};
    if(!s.weekly.splitBudgets) s.weekly.splitBudgets = {};
    if(!s.ui) s.ui = {};
    if(!s.ui.groupOffsets) s.ui.groupOffsets = {};
    if(s.ui.savingsOffset === undefined) s.ui.savingsOffset = 0;

    function migrateBucket(bucket){
      Object.keys(bucket || {}).forEach(catId=>{
        if(typeof bucket[catId] === 'number'){
          const amt = bucket[catId];
          bucket[catId] = amt > 0 ? [{ id: uid(), note: '', amount: amt }] : [];
        }
      });
    }

    // ---- Migrate from the previous per-period-bucket model into flat, dated entries ----
    let needsEntryMigration = false;

    // Old weekly split flag was per-week (not per-category): { [weekKey]: isoDate }
    // New format is per-category: { [weekKey]: { [catId]: isoDate } }
    const oldSplits = s.weekly.splits || {};
    const splitKeys = Object.keys(oldSplits);
    if(splitKeys.length && splitKeys.every(k => typeof oldSplits[k] === 'string')){
      const migrated = {};
      splitKeys.forEach(weekKey=>{
        const iso = oldSplits[weekKey];
        migrated[weekKey] = {};
        (s.weekly.categories||[]).forEach(c=>{ migrated[weekKey][c.id] = iso; });
      });
      s.weekly.splits = migrated;
    }

    if(s.weekly.weeks){
      Object.keys(s.weekly.weeks).forEach(rawKey=>{
        migrateBucket(s.weekly.weeks[rawKey]);
        const bucket = s.weekly.weeks[rawKey];
        // rawKey may be "YYYY-MM-DD" or "YYYY-MM-DD:a"/":b" for old split mini-periods
        const baseKey = rawKey.split(':')[0];
        Object.keys(bucket).forEach(catId=>{
          if(!s.entries[catId]) s.entries[catId] = [];
          (bucket[catId]||[]).forEach(entry=>{
            s.entries[catId].push({ id: entry.id || uid(), date: entry.date || baseKey, note: entry.note||'', amount: Number(entry.amount)||0 });
          });
        });
      });
      delete s.weekly.weeks;
      needsEntryMigration = true;
    }

    if(s.monthly.months && !s.monthly.data){ s.monthly.data = s.monthly.months; delete s.monthly.months; }
    if(s.monthly.data){
      Object.keys(s.monthly.data).forEach(groupKey=>{
        Object.keys(s.monthly.data[groupKey]).forEach(periodIso=>{
          migrateBucket(s.monthly.data[groupKey][periodIso]);
          const bucket = s.monthly.data[groupKey][periodIso];
          Object.keys(bucket).forEach(catId=>{
            if(!s.entries[catId]) s.entries[catId] = [];
            (bucket[catId]||[]).forEach(entry=>{
              s.entries[catId].push({ id: entry.id || uid(), date: entry.date || periodIso, note: entry.note||'', amount: Number(entry.amount)||0 });
            });
          });
        });
      });
      delete s.monthly.data;
      needsEntryMigration = true;
    }

    (s.weekly.categories||[]).forEach(c=>{ if(c.linkedMonthlyCatId === undefined) c.linkedMonthlyCatId = null; });

    // ---- Savings: migrate old plan/goal model into the new manual ledger ----
    if(!s.savings) s.savings = {};
    if(s.savings.columns === undefined){
      s.savings.startingBalance = Number(s.savings.startingBalance)||0;
      s.savings.cycleStartDay = 1;
      s.savings.planLength = s.savings.planLength || 18;
      s.savings.columns = defaultSavingsColumns();
      s.savings.months = {};
      s.savings.goal = null;
    }
    s.savings.columns.forEach(col=>{
      if(col.sign === undefined){
        col.sign = LEGACY_SAVINGS_COLUMN_SIGN[col.key] !== undefined ? LEGACY_SAVINGS_COLUMN_SIGN[col.key] : 1;
      }
    });
    if(!s.savings.months) s.savings.months = {};

    return s;
  }

  const openPanels = new Set(); // transient UI state (open forms/pickers/edit boxes), not persisted

  // A Yes/No confirm dialog with our own button labels (native confirm() always
  // shows "OK/Cancel" and that can't be changed by a website).
  function customConfirm(message){
    return new Promise(resolve=>{
      const overlay = document.getElementById('customConfirmOverlay');
      const msgEl = document.getElementById('customConfirmMessage');
      const yesBtn = document.getElementById('customConfirmYes');
      const noBtn = document.getElementById('customConfirmNo');
      msgEl.textContent = message;
      overlay.style.display = 'flex';
      function cleanup(result){
        overlay.style.display = 'none';
        yesBtn.removeEventListener('click', onYes);
        noBtn.removeEventListener('click', onNo);
        resolve(result);
      }
      function onYes(){ cleanup(true); }
      function onNo(){ cleanup(false); }
      yesBtn.addEventListener('click', onYes);
      noBtn.addEventListener('click', onNo);
    });
  }

  function defaultState(){
    return {
      profile: { name: '' },
      entries: {},
      weekly: { startDay: 1, categories: [], splits: {}, splitBudgets: {} },
      monthly: { income: 0, groups: defaultGroups(), categories: [] },

  let state = null;

  // ---------- Date helpers ----------
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function startOfWeek(d, startDay){
    startDay = startDay === undefined ? 1 : startDay;
    const date = new Date(d);
    const day = (date.getDay() - startDay + 7) % 7;
    date.setDate(date.getDate() - day);
    date.setHours(0,0,0,0);
    return date;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function addMonths(d, n){ const r = new Date(d); r.setMonth(r.getMonth()+n); return r; }
  function isoDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function parseIso(iso){ return new Date(iso + 'T00:00:00'); }
  function monthLabelOf(key){
    const [y,m] = key.split('-').map(Number);
    return new Date(y, m-1, 1).toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  }
  function fmtDayMonth(d){ return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); }
  function fmtDayMonthYear(d){ return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
  function daysInMonth(y, mIdx){ return new Date(y, mIdx+1, 0).getDate(); }
  function ordinal(n){
    const s = ['th','st','nd','rd'], v = n % 100;
    return n + (s[(v-20)%10] || s[v] || s[0]);
  }

  // A "cycle" recurs monthly starting on the same day (e.g. the 15th, or the 6th)
  // instead of always the 1st. Capped at day 28 so it works identically every month.
  function cycleStartForOffset(refDate, cycleStartDay, offset){
    let year = refDate.getFullYear(), month = refDate.getMonth();
    if(refDate.getDate() < cycleStartDay){
      month -= 1;
      if(month < 0){ month = 11; year -= 1; }
    }
    const base = new Date(year, month, cycleStartDay);
    return addMonths(base, offset);
  }
  function cycleEndFor(cycleStart){
    const end = addMonths(cycleStart, 1);
    end.setDate(end.getDate() - 1);
    return end;
  }

  function fmt(n){
    n = Number(n) || 0;
    const sign = n < 0 ? '-' : '';
    return sign + '£' + Math.abs(n).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtCompact(n){
    n = Number(n) || 0;
    const sign = n<0 ? '-' : '';
    return sign + '£' + Math.abs(n).toLocaleString('en-GB', {minimumFractionDigits:0, maximumFractionDigits:0});
  }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // ---------- Entries (shared, dated store; weekly & monthly are just date-range views) ----------
  function effectiveEntryCatId(c){ return c.linkedMonthlyCatId || c.id; }

  function entriesInRange(entryCatId, startIso, endIso){
    return (state.entries[entryCatId] || []).filter(e => e.date >= startIso && e.date <= endIso);
  }
  function sumEntries(entries){
    return (entries || []).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
  }

  function findMonthlyCategory(catId){
    return state.monthly.categories.find(c=>c.id===catId);
  }

  // ---------- CSV import (bank statement transactions -> expense entries) ----------
  const csvImports = {}; // entryCatId -> {headers, dataRows, dateCol, noteCol, amountCol, onlyNegative} — transient, not persisted

  function parseCsv(text){
    const rows = [];
    let row = [], cell = '', inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ cell += '"'; i++; }
          else inQuotes = false;
        } else cell += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(cell); cell = ''; }
        else if(c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
        else if(c === '\r'){ /* skip; \n follows */ }
        else cell += c;
      }
    }
    if(cell.length || row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function parseCsvAmount(str){
    if(str === undefined || str === null) return NaN;
    let s = String(str).trim();
    if(!s) return NaN;
    let neg = false;
    if(s.startsWith('(') && s.endsWith(')')){ neg = true; s = s.slice(1,-1); }
    s = s.replace(/[£$€,]/g, '').trim();
    if(s.startsWith('-')){ neg = true; s = s.slice(1); }
    else if(s.startsWith('+')){ s = s.slice(1); }
    const n = parseFloat(s);
    if(isNaN(n)) return NaN;
    return neg ? -n : n;
  }

  function parseCsvDate(str){
    if(!str) return null;
    const s = String(str).trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return isoDate(new Date(+m[1], +m[2]-1, +m[3]));
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if(m) return isoDate(new Date(+m[3], +m[2]-1, +m[1]));
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
    if(m) return isoDate(new Date(2000+(+m[3]), +m[2]-1, +m[1]));
    const d = new Date(s);
    if(!isNaN(d.getTime())) return isoDate(d);
    return null;
  }

  function guessCsvColumn(headers, keywords){
    for(let i=0;i<headers.length;i++){
      const h = (headers[i]||'').toLowerCase();
      if(keywords.some(k=>h.includes(k))) return i;
    }
    return -1;
  }

  // Bank accounts show a purchase as negative; credit cards show a purchase as
  // positive (since it adds to what you owe). This flips which convention we use.
  function csvIsPurchaseRow(imp, amtRaw){
    return imp.statementType === 'creditcard' ? amtRaw > 0 : amtRaw < 0;
  }
  function csvEntryAmount(imp, amtRaw){
    return imp.statementType === 'creditcard' ? amtRaw : -amtRaw;
  }

  function renderCsvImportPanel(entryCatId){

    if(!imp){
      return `

          <input type="file" accept=".csv,text/csv" data-action="csv-file-selected" data-entrycat="${entryCatId}">
        </div>
        <div class="suggestion">Pick a CSV export from your bank or card provider (with a header row) — you'll get to choose the columns and statement type next.</div>`;
    }
    const headerOpts = (selected) => imp.headers.map((h,i)=>`<option value="${i}" ${selected===i?'selected':''}>${escapeHtml(h || 'Column '+(i+1))}</option>`).join('');
    const previewRows = imp.dataRows.slice(0, 5).map(r=>{
      const date = parseCsvDate(r[imp.dateCol]);
      const note = imp.noteCol>=0 ? (r[imp.noteCol]||'') : '';
      const amt = parseCsvAmount(r[imp.amountCol]);
      return { date, note, amt };
    });
    const previewHtml = previewRows.map(p=>`
      <div class="expense-row">
        <span class="note">${p.date ? fmtDayMonth(parseIso(p.date)) : '(bad date)'} — ${escapeHtml(p.note || '(no note)')}</span>
        <span class="amt">${isNaN(p.amt) ? '?' : fmt(csvEntryAmount(imp, p.amt))}</span>
      </div>`).join('');
    const validCount = imp.dataRows.filter(r=>{
      const date = parseCsvDate(r[imp.dateCol]);
      const amt = parseCsvAmount(r[imp.amountCol]);
      return date && !isNaN(amt) && amt !== 0 && (!imp.onlyNegative || csvIsPurchaseRow(imp, amt));
    }).length;
    return `
      <div class="field-row">
        <div class="field"><label>Statement type</label>
          <select data-action="csv-set-statementtype" data-entrycat="${entryCatId}">
            <option value="bank" ${imp.statementType!=='creditcard'?'selected':''}>Bank / debit account</option>
            <option value="creditcard" ${imp.statementType==='creditcard'?'selected':''}>Credit card</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date column</label>
          <select data-action="csv-set-datecol" data-entrycat="${entryCatId}">${headerOpts(imp.dateCol)}</select>
        </div>
        <div class="field"><label>Description column</label>
          <select data-action="csv-set-notecol" data-entrycat="${entryCatId}">${headerOpts(imp.noteCol)}</select>
        </div>
        <div class="field"><label>Amount column</label>
          <select data-action="csv-set-amountcol" data-entrycat="${entryCatId}">${headerOpts(imp.amountCol)}</select>
        </div>
      </div>
      <label class="row-inline" style="font-size:12.5px; margin-bottom:8px;">
        <input type="checkbox" ${imp.onlyNegative?'checked':''} data-action="csv-toggle-negative" data-entrycat="${entryCatId}">
        Only import purchases — turn off to also bring in refunds/payments (they'll be added as negative amounts, reducing your total)
      </label>
      <div class="expense-list">${previewHtml}</div>
      <div class="suggestion">${validCount} transaction(s) will be imported. Showing up to 5 rows as a preview.</div>
      <div class="row-inline" style="justify-content:flex-end; margin-top:10px;">
        <button class="btn secondary small" data-action="csv-cancel" data-entrycat="${entryCatId}">Cancel</button>
        <button class="btn small" data-action="csv-import" data-entrycat="${entryCatId}">Import ${validCount} transaction(s)</button>
      </div>`;
  }

  // ---------- Runway bar (signature component) ----------
  function runwayBar(budget, spent, pacePercent){
    const b = Number(budget)||0;
    const s = Number(spent)||0;
    const fillPct = b>0 ? Math.max(0, Math.min((s/b)*100, 100)) : (s>0 ? 100 : 0);
    const over = s > b && b > 0;
    const cls = over ? 'spend' : 'grow';
    const pace = Math.max(0, Math.min(100, pacePercent));
    return `<div class="runway">
      <div class="runway-fill ${cls}" style="width:${fillPct}%"></div>
      <div class="runway-pace" style="left:${pace}%"></div>
    </div>`;
  }

  function paceStatus(budget, spent, pacePercent){
    const b = Number(budget)||0;
    const s = Number(spent)||0;
    const expected = b * (pacePercent/100);
    const diff = expected - s;
    if(b === 0 && s === 0) return {text:'No budget set', cls:'neutral'};
    if(diff >= 0) return {text: `${fmt(diff)} ahead of pace`, cls:'grow'};
    return {text: `${fmt(Math.abs(diff))} behind pace`, cls:'spend'};
  }
  function shouldHaveLeftStat(budget, pacePercent){
    const b = Number(budget)||0;
    return b * (1 - pacePercent/100);
  }

  // ---------- Itemized expenses (add-up-as-you-go) ----------

        <button class="iconbtn" data-action="toggle-panel" data-panel="${editKey}" title="Edit">✏️</button>

        <span>${entries.length} transaction${entries.length===1?'':'s'} — ${fmt(sumEntries(entries))}</span>
        <span>${listOpen ? '▲' : '▼'}</span>
      </button>
      ${listOpen ? `<div class="expense-list">${rows}</div>` : ''}
    ` : '';
    return `
      ${listSection}
      <div class="row-inline" style="flex-wrap:wrap; margin-top:8px;">
        <button class="add-toggle small" data-action="toggle-panel" data-panel="${formId}">+ Add expense</button>
        <button class="add-toggle small" data-action="toggle-panel" data-panel="${csvPanelId}">📄 Import from CSV</button>
      </div>
      <div id="${formId}" style="display:${isOpen?'block':'none'}; margin-top:8px;">
        <div class="add-form">
          <input type="date" id="${formId}-date" value="${dateDefault}" style="max-width:135px;">
          <input type="text" id="${formId}-note" placeholder="What was it? (optional)">
          <input type="number" id="${formId}-amount" step="0.01" placeholder="£ (use a minus for refunds)">
          <button class="btn small" data-action="add-expense" data-entrycat="${entryCatId}" data-form="${formId}">Add</button>
        </div>
      </div>
      <div id="${csvPanelId}" style="display:${csvOpen?'block':'none'}; margin-top:8px;">
        ${renderCsvImportPanel(entryCatId)}
      </div>`;
  }

  // ---------- Interactive calendar picker ----------
  function renderCalendarPicker(mode, groupKey, selectedValue){
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth();
    const first = new Date(y, m, 1);
    const startWeekday = first.getDay();
    const dim = daysInMonth(y, m);
    let cells = '';
    for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
    for(let d=1; d<=dim; d++){
      const weekday = (startWeekday + d - 1) % 7;
      let selected, disabled, action, value;
      if(mode === 'weekday'){
        selected = weekday === selectedValue;
        disabled = false;
        action = 'pick-weekday'; value = weekday;
      } else {
        selected = d === selectedValue;
        disabled = d > 28;
        action = 'pick-cycle-day'; value = d;
      }
      cells += `<button type="button" class="cal-cell${selected?' selected':''}${disabled?' disabled':''}"
        ${disabled?'disabled':''} data-action="${action}" data-value="${value}" ${groupKey?`data-group="${escapeHtml(groupKey)}"`:''}>${d}</button>`;
    }
    const hint = mode === 'weekday'
      ? 'Click any date — its weekday becomes your week-start day.'
      : 'Click a date (1–28) to set the cycle start day. 29–31 are disabled so every month behaves the same way.';
    return `<div class="calendar">
      <div class="cal-head">${DAY_ABBR.map(n=>`<div class="cal-dow">${n}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="cal-hint">${hint}</div>
    </div>`;
  }

  function renderWeekSplitPicker(weekStart, weekKey, catId, selectedIso){
    let cells = '';
    for(let i=0;i<7;i++){
      const d = addDays(weekStart, i);
      const iso = isoDate(d);
      const selected = iso === selectedIso;
      cells += `<button type="button" class="cal-cell${selected?' selected':''}" data-action="pick-week-split" data-value="${iso}" data-week="${weekKey}" data-cat="${catId}">
        <span style="display:block;font-size:8.5px;opacity:0.7;line-height:1.4;">${DAY_ABBR[d.getDay()]}</span>${d.getDate()}
      </button>`;
    }
    return `<div class="calendar">
      <div class="cal-grid">${cells}</div>
      <div class="cal-hint">Click the date this category's new mini-period should start on.</div>
    </div>`;
  }

  function renderMiniPeriod(weekKey, part, label, c, budget, entryCatId, rangeStart, rangeEnd, pacePercent){
    const entries = entriesInRange(entryCatId, rangeStart, rangeEnd);
    const spent = sumEntries(entries);
    const status = paceStatus(budget, spent, pacePercent);
    return `
      <div class="mini-period">
        <div class="mini-period-head">
          <span class="mini-period-label">${label}</span>
          <span class="row-inline">
            <span style="font-size:11px;color:var(--ink-faint);">Budget</span>
            <input class="amount-input" type="number" step="0.01" min="0" value="${budget}"
              data-action="set-split-budget" data-week="${weekKey}" data-cat="${c.id}" data-part="${part}">
          </span>
        </div>
        ${runwayBar(budget, spent, pacePercent)}
        <div class="cat-foot">
          <span class="pace-status ${status.cls}">${status.text}</span>
          <span>${fmt(spent)} of ${fmt(budget)}</span>
        </div>
        ${renderExpenseBlock(entryCatId, rangeStart, rangeEnd, `weekly-${weekKey}-${part}-${c.id}`, rangeStart)}
      </div>`;
  }

  // ---------- Inline rename/edit helper ----------
  function editRow(kind, id, currentName, currentBudget, extraFieldsHtml){
    const key = `edit-${kind}-${id}`;
    const isEditing = openPanels.has(key);
    return { key, isEditing };
  }

  // ---------- Rendering shell ----------
  const mainTabsEl = document.getElementById('mainTabs');
  const subtabsEl = document.getElementById('subtabs');
  const mainEl = document.getElementById('main');
  const profileNameEl = document.getElementById('profileName');

  function renderShell(){
    [...mainTabsEl.children].forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.tab === state.ui.tab);
    });
    subtabsEl.style.display = state.ui.tab === 'spending' ? 'flex' : 'none';
    if(state.ui.tab === 'spending'){
      [...subtabsEl.children].forEach(btn=>{
        btn.classList.toggle('active', btn.dataset.subtab === state.ui.subtab);
      });
    }
    if(profileNameEl){
      profileNameEl.textContent = state.profile.name ? `${state.profile.name}’s tracker` : '';
    }
  }

  function render(){
    renderShell();
    if(state.ui.tab === 'spending'){
      mainEl.innerHTML = state.ui.subtab === 'weekly' ? renderWeekly() : renderMonthly();
    } else {
      mainEl.innerHTML = renderSavings();
    }
  }

  // ---------- Weekly view ----------
  function currentWeekStart(){
    return addDays(startOfWeek(new Date(), state.weekly.startDay), state.ui.weekOffset * 7);
  }

  function monthlyCategoryOptions(selectedId){
    let opts = `<option value="">No link (weekly only)</option>`;
    state.monthly.groups.forEach(g=>{
      const cats = state.monthly.categories.filter(c=>(c.group===g.key));
      if(!cats.length) return;
      opts += `<optgroup label="${escapeHtml(g.label)}">`;
      cats.forEach(c=>{
        opts += `<option value="${c.id}" ${selectedId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`;
      });
      opts += `</optgroup>`;
    });
    return opts;
  }

  function renderWeeklyCatCard(c, weekStart, weekEnd, weekKey, weekOffset, today){
    const entryCatId = effectiveEntryCatId(c);
    const linkedCat = c.linkedMonthlyCatId ? findMonthlyCategory(c.linkedMonthlyCatId) : null;
    const linkedBadge = linkedCat ? `<span class="link-badge">↔ ${escapeHtml(linkedCat.name)}</span>` : '';
    const editKey = `edit-weeklycat-${c.id}`;
    const isEditing = openPanels.has(editKey);

    if(isEditing){
      return `
      <div class="cat-card">
        <div class="add-form" style="flex-direction:column; align-items:stretch;">
          <input type="text" id="editName-${c.id}" value="${escapeHtml(c.name)}" placeholder="Category name">
          <input type="number" id="editBudget-${c.id}" value="${c.budget}" step="0.01" min="0" placeholder="Weekly £">
          <label style="font-size:11px; color:var(--ink-faint);">Link to a monthly budget item (optional)
            <select id="editLink-${c.id}" style="width:100%; padding:8px; border-radius:7px; border:1px solid var(--line); margin-top:4px;">
              ${monthlyCategoryOptions(c.linkedMonthlyCatId)}
            </select>
          </label>
          <div class="row-inline" style="justify-content:flex-end;">
            <button class="btn secondary small" data-action="cancel-edit" data-panel="${editKey}">Cancel</button>
            <button class="btn small" data-action="save-weeklycat-edit" data-cat="${c.id}">Save</button>
          </div>
        </div>
      </div>`;
    }

    const splitMap = state.weekly.splits[weekKey] || {};
    const splitIso = splitMap[c.id] || null;
    const splitCalId = `weekSplitCal-${weekKey}-${c.id}`;
    const splitCalOpen = openPanels.has(splitCalId);

    let bodyHtml, budgetForHead, spentForHead;

    if(splitIso){
      const splitDate = parseIso(splitIso);
      const partAEnd = addDays(splitDate, -1);
      const partADays = Math.round((partAEnd - weekStart)/86400000) + 1;
      const partBDays = Math.round((weekEnd - splitDate)/86400000) + 1;
      let paceA, paceB;
      if(weekOffset < 0){ paceA = 100; paceB = 100; }
      else if(weekOffset > 0){ paceA = 0; paceB = 0; }
      else {
        const elapsedA = Math.min(partADays, Math.max(0, Math.floor((today - weekStart)/86400000) + 1));
        paceA = (elapsedA/partADays)*100;
        const elapsedB = Math.min(partBDays, Math.max(0, Math.floor((today - splitDate)/86400000) + 1));
        paceB = (elapsedB/partBDays)*100;
      }
      const overrides = (state.weekly.splitBudgets[weekKey]||{})[c.id] || {};
      const defaultA = Math.round((Number(c.budget)||0) * partADays/7 * 100)/100;
      const defaultB = Math.round((Number(c.budget)||0) * partBDays/7 * 100)/100;
      const budgetA = overrides.a !== undefined ? overrides.a : defaultA;
      const budgetB = overrides.b !== undefined ? overrides.b : defaultB;
      const partAEndIso = isoDate(partAEnd), splitIsoStr = isoDate(splitDate), weekEndIso = isoDate(weekEnd), weekStartIso = isoDate(weekStart);
      const spentA = sumEntries(entriesInRange(entryCatId, weekStartIso, partAEndIso));
      const spentB = sumEntries(entriesInRange(entryCatId, splitIsoStr, weekEndIso));
      budgetForHead = budgetA + budgetB; spentForHead = spentA + spentB;
      bodyHtml = `
        ${renderMiniPeriod(weekKey, 'a', `${fmtDayMonth(weekStart)} – ${fmtDayMonth(partAEnd)}`, c, budgetA, entryCatId, weekStartIso, partAEndIso, paceA)}
        ${renderMiniPeriod(weekKey, 'b', `${fmtDayMonth(splitDate)} – ${fmtDayMonth(weekEnd)}`, c, budgetB, entryCatId, splitIsoStr, weekEndIso, paceB)}
        <button class="iconbtn" data-action="remove-week-split" data-week="${weekKey}" data-cat="${c.id}" style="margin-top:6px;">Undo split ✕</button>
      `;
    } else {
      const weekStartIso = isoDate(weekStart), weekEndIso = isoDate(weekEnd);
      let daysElapsed;
      if(weekOffset < 0) daysElapsed = 7;
      else if(weekOffset > 0) daysElapsed = 0;
      else daysElapsed = Math.min(7, Math.floor((today - weekStart)/86400000) + 1);
      const pacePercent = (daysElapsed/7)*100;
      const entries = entriesInRange(entryCatId, weekStartIso, weekEndIso);
      const spent = sumEntries(entries);
      budgetForHead = Number(c.budget)||0; spentForHead = spent;
      const status = paceStatus(c.budget, spent, pacePercent);
      bodyHtml = `
        ${runwayBar(c.budget, spent, pacePercent)}
        <div class="cat-foot">
          <span class="pace-status ${status.cls}">${status.text}</span>
          <span>${fmt(spent)} of ${fmt(c.budget)}</span>
        </div>
        ${renderExpenseBlock(entryCatId, weekStartIso, weekEndIso, `weekly-${weekKey}-${c.id}`, weekStartIso)}
        <button class="btn secondary small" data-action="toggle-panel" data-panel="${splitCalId}" style="margin-top:10px;">✂️ Split this category's week</button>
        <div id="${splitCalId}" style="display:${splitCalOpen?'block':'none'}; margin-top:8px;">
          ${renderWeekSplitPicker(weekStart, weekKey, c.id, null)}
        </div>
      `;
    }

    return `
      <div class="cat-card">
        <div class="cat-head">
          <div>
            <div class="cat-name">${escapeHtml(c.name)} ${linkedBadge}</div>
            <div class="cat-budget">${fmt(budgetForHead)} / week${splitIso ? ' (split)' : ''}</div>
          </div>
          <div class="cat-actions">
            <div class="cat-total">${fmt(spentForHead)}</div>
            <button class="iconbtn" data-action="toggle-panel" data-panel="${editKey}" title="Edit">✏️</button>
            <button class="iconbtn" data-action="delete-weekly-cat" data-cat="${c.id}" title="Remove category">✕</button>
          </div>
        </div>
        ${bodyHtml}
      </div>`;
  }

  function renderWeekly(){
    const weekStart = currentWeekStart();
    const weekEnd = addDays(weekStart, 6);
    const key = isoDate(weekStart);
    const today = new Date();
    const cats = state.weekly.categories;

    let totalBudget = 0, totalSpent = 0;
    const catRows = cats.map(c=>{
      const card = renderWeeklyCatCard(c, weekStart, weekEnd, key, state.ui.weekOffset, today);
      // recompute totals independent of edit-mode rendering
      const entryCatId = effectiveEntryCatId(c);
      const splitIso = (state.weekly.splits[key]||{})[c.id];
      if(splitIso){
        const splitDate = parseIso(splitIso);
        const partAEnd = addDays(splitDate,-1);
        const overrides = (state.weekly.splitBudgets[key]||{})[c.id] || {};
        const partADays = Math.round((partAEnd-weekStart)/86400000)+1;
        const partBDays = Math.round((weekEnd-splitDate)/86400000)+1;
        const budgetA = overrides.a !== undefined ? overrides.a : Math.round((Number(c.budget)||0)*partADays/7*100)/100;
        const budgetB = overrides.b !== undefined ? overrides.b : Math.round((Number(c.budget)||0)*partBDays/7*100)/100;
        totalBudget += budgetA+budgetB;
        totalSpent += sumEntries(entriesInRange(entryCatId, isoDate(weekStart), isoDate(partAEnd))) + sumEntries(entriesInRange(entryCatId, isoDate(splitDate), isoDate(weekEnd)));
      } else {
        totalBudget += Number(c.budget)||0;
        totalSpent += sumEntries(entriesInRange(entryCatId, isoDate(weekStart), isoDate(weekEnd)));
      }
      return card;
    }).join('');

    let daysElapsed;
    if(state.ui.weekOffset < 0) daysElapsed = 7;
    else if(state.ui.weekOffset > 0) daysElapsed = 0;
    else daysElapsed = Math.min(7, Math.floor((today - weekStart)/86400000) + 1);
    const weekPace = (daysElapsed/7)*100;

    const weekCalOpen = openPanels.has('weekCal');

    return `
    <div class="card">
      <div class="period-nav">
        <div>
          <span class="period-label">${fmtDayMonth(weekStart)} – ${fmtDayMonth(weekEnd)}</span>
          <span class="period-sub">${state.ui.weekOffset===0 ? 'This week' : (state.ui.weekOffset<0 ? `${Math.abs(state.ui.weekOffset)} week(s) ago` : `In ${state.ui.weekOffset} week(s)`)}</span>
        </div>
        <div class="nav-arrows">
          <button class="navbtn" data-action="week-prev">‹</button>
          <button class="navbtn" data-action="week-today">•</button>
          <button class="navbtn" data-action="week-next">›</button>
        </div>
      </div>
      <div class="summary-row">
        <div class="stat"><div class="label">Budget</div><div class="value">${fmt(totalBudget)}</div></div>
        <div class="stat"><div class="label">Spent</div><div class="value ${totalSpent>totalBudget && totalBudget>0 ?'spend':''}">${fmt(totalSpent)}</div></div>
        <div class="stat"><div class="label">Should have left</div><div class="value">${fmt(shouldHaveLeftStat(totalBudget, weekPace))}</div></div>
        <div class="stat"><div class="label">Left</div><div class="value ${totalBudget-totalSpent<0?'spend':'grow'}">${fmt(totalBudget-totalSpent)}</div></div>
      </div>
      <button class="btn secondary small" data-action="toggle-panel" data-panel="weekCal" style="margin-top:12px;">📅 Week starts ${DAY_NAMES[state.weekly.startDay]}</button>
      <div id="weekCal" style="display:${weekCalOpen?'block':'none'}; margin-top:10px;">
        ${renderCalendarPicker('weekday', null, state.weekly.startDay)}
      </div>
    </div>

    ${cats.length ? catRows : emptyState('No weekly categories yet', 'Add pots like "Eating out" or "Transport" to pace your week-to-week spending.')}

    <button class="add-toggle" data-action="toggle-panel" data-panel="addWeeklyForm">+ Add a weekly category</button>
    <div id="addWeeklyForm" style="display:${openPanels.has('addWeeklyForm')?'block':'none'}; margin-top:10px;">
      <div class="add-form" style="flex-direction:column; align-items:stretch;">
        <input type="text" id="newWeeklyName" placeholder="Category name (e.g. Eating out)">
        <input type="number" id="newWeeklyBudget" placeholder="Weekly £" step="0.01" min="0">
        <label style="font-size:11px; color:var(--ink-faint);">Link to a monthly budget item (optional) — expenses logged here will also count toward that item's monthly total
          <select id="newWeeklyLink" style="width:100%; padding:8px; border-radius:7px; border:1px solid var(--line); margin-top:4px;">
            ${monthlyCategoryOptions(null)}
          </select>
        </label>
        <button class="btn" data-action="add-weekly-cat">Add</button>
      </div>
    </div>
    `;
  }

  // ---------- Monthly view ----------
  const DEFAULT_GROUP_COPY = {
    rent: { placeholder:'e.g. Rent', addLabel:'+ Add rent',
      emptyBig:'No rent added yet', emptySmall:"Add your rent (or mortgage) so it's tracked on its own — separate from everyday spending." },
    bills: { placeholder:'e.g. Phone, electricity, subscriptions', addLabel:'+ Add a bill',
      emptyBig:'No bills added yet', emptySmall:'Add recurring bills like phone, utilities or subscriptions — kept separate from everyday spending.' },
    everyday: { placeholder:'e.g. Groceries, going out, transport', addLabel:'+ Add an everyday category',
      emptyBig:'No everyday categories yet', emptySmall:'Add the flexible stuff — groceries, going out, transport. This is your actual budget to pace against.' }
  };
  function groupCopy(g){
    return DEFAULT_GROUP_COPY[g.key] || {
      placeholder: `e.g. a ${g.label} category`, addLabel: `+ Add to ${g.label}`,
      emptyBig: `No categories in ${g.label} yet`, emptySmall: `Add a category to start tracking ${g.label.toLowerCase()}.`
    };
  }

  function groupOf(c){
    return state.monthly.groups.some(g=>g.key===c.group) ? c.group : (state.monthly.groups[0] ? state.monthly.groups[0].key : 'everyday');
  }
  function groupOffset(gKey){ return state.ui.groupOffsets[gKey] || 0; }

  function computeGroupCurrentTotals(g){
    const cycleStart = cycleStartForOffset(new Date(), g.cycleStartDay || 1, 0);
    const cycleEnd = cycleEndFor(cycleStart);
    const startIso = isoDate(cycleStart), endIso = isoDate(cycleEnd);
    const cats = state.monthly.categories.filter(c => groupOf(c) === g.key);
    let budget = 0, spent = 0;
    cats.forEach(c=>{ budget += Number(c.budget)||0; spent += sumEntries(entriesInRange(c.id, startIso, endIso)); });
    return { budget, spent };
  }

  function renderMonthlyCatCard(c, startIso, endIso, pacePercent){
    const editKey = `edit-monthlycat-${c.id}`;
    if(openPanels.has(editKey)){
      return `
      <div class="cat-card">
        <div class="add-form" style="flex-direction:column; align-items:stretch;">
          <input type="text" id="editName-${c.id}" value="${escapeHtml(c.name)}" placeholder="Category name">
          <input type="number" id="editBudget-${c.id}" value="${c.budget}" step="0.01" min="0" placeholder="Per cycle £">
          <div class="row-inline" style="justify-content:flex-end;">
            <button class="btn secondary small" data-action="cancel-edit" data-panel="${editKey}">Cancel</button>
            <button class="btn small" data-action="save-monthlycat-edit" data-cat="${c.id}">Save</button>
          </div>
        </div>
      </div>`;
    }
    const entries = entriesInRange(c.id, startIso, endIso);
    const spent = sumEntries(entries);
    const status = paceStatus(c.budget, spent, pacePercent);
    const isFixedPayment = groupOf(c) === 'rent' || groupOf(c) === 'bills';
    return `
    <div class="cat-card">
      <div class="cat-head">
        <div>
          <div class="cat-name">${escapeHtml(c.name)}</div>
          <div class="cat-budget">${fmt(c.budget)} / cycle</div>
        </div>
        <div class="cat-actions">
          <div class="cat-total">${fmt(spent)}</div>
          <button class="iconbtn" data-action="toggle-panel" data-panel="${editKey}" title="Edit">✏️</button>
          <button class="iconbtn" data-action="delete-monthly-cat" data-cat="${c.id}" title="Remove category">✕</button>
        </div>
      </div>
      ${runwayBar(c.budget, spent, pacePercent)}
      <div class="cat-foot">
        ${isFixedPayment ? '<span></span>' : `<span class="pace-status ${status.cls}">${status.text}</span>`}
        <span>${fmt(spent)} of ${fmt(c.budget)}</span>
      </div>
      ${renderExpenseBlock(c.id, startIso, endIso, `monthly-${groupOf(c)}-${startIso}-${c.id}`, isoDate(new Date()))}
    </div>`;
  }

  function renderMonthlyGroupSection(g){
    const copy = groupCopy(g);
    const cycleStartDay = g.cycleStartDay || 1;
    const offset = groupOffset(g.key);
    const cycleStart = cycleStartForOffset(new Date(), cycleStartDay, offset);
    const cycleEnd = cycleEndFor(cycleStart);
    const totalDays = Math.round((cycleEnd - cycleStart)/86400000) + 1;
    const today = new Date();
    let daysElapsed;
    if(offset < 0) daysElapsed = totalDays;
    else if(offset > 0) daysElapsed = 0;
    else daysElapsed = Math.min(totalDays, Math.max(0, Math.floor((today - cycleStart)/86400000) + 1));
    const pacePercent = (daysElapsed/totalDays)*100;
    const startIso = isoDate(cycleStart), endIso = isoDate(cycleEnd);

    const cats = state.monthly.categories.filter(c => groupOf(c) === g.key);
    let groupBudget = 0, groupSpent = 0;
    cats.forEach(c=>{ groupBudget += Number(c.budget)||0; groupSpent += sumEntries(entriesInRange(c.id, startIso, endIso)); });
    const catRows = cats.map(c => renderMonthlyCatCard(c, startIso, endIso, pacePercent)).join('');

    const calId = `cycleCal-${g.key}`;
    const calOpen = openPanels.has(calId);
    const editKey = `edit-group-${g.key}`;
    const isEditingGroup = openPanels.has(editKey);
    const groupIndex = state.monthly.groups.indexOf(g);
    const isFirst = groupIndex === 0;
    const isLast = groupIndex === state.monthly.groups.length - 1;

    const headHtml = isEditingGroup ? `
      <div class="add-form" style="margin-bottom:14px;">
        <input type="text" id="editGroupName-${g.key}" value="${escapeHtml(g.label)}" placeholder="Section name">
        <button class="btn small" data-action="save-group-edit" data-group="${g.key}">Save</button>
        <button class="btn secondary small" data-action="cancel-edit" data-panel="${editKey}">Cancel</button>
      </div>
    ` : `
      <div class="section-head">
        <h2>${escapeHtml(g.label)}</h2>
        <div class="row-inline">
          <button class="iconbtn" data-action="move-group-up" data-group="${g.key}" title="Move up" ${isFirst?'disabled style="opacity:0.3;"':''}>▲</button>
          <button class="iconbtn" data-action="move-group-down" data-group="${g.key}" title="Move down" ${isLast?'disabled style="opacity:0.3;"':''}>▼</button>
          <button class="iconbtn" data-action="toggle-panel" data-panel="${editKey}" title="Rename section">✏️</button>
          <button class="iconbtn" data-action="delete-monthly-group" data-group="${g.key}" title="Remove this section">✕</button>
        </div>
      </div>
    `;

    return {
      html: `
      <div class="card">
        ${headHtml}
        <div class="period-nav">
          <div>
            <span class="period-label">${fmtDayMonth(cycleStart)} – ${fmtDayMonth(cycleEnd)}</span>
            <span class="period-sub">${offset===0 ? 'Current cycle' : (offset<0 ? `${Math.abs(offset)} cycle(s) ago` : `In ${offset} cycle(s)`)}</span>
          </div>
          <div class="nav-arrows">
            <button class="navbtn" data-action="group-cycle-prev" data-group="${g.key}">‹</button>
            <button class="navbtn" data-action="group-cycle-today" data-group="${g.key}">•</button>
            <button class="navbtn" data-action="group-cycle-next" data-group="${g.key}">›</button>
          </div>
        </div>
        <button class="btn secondary small" data-action="toggle-panel" data-panel="${calId}" style="margin-bottom:12px;">📅 Cycle starts on the ${ordinal(cycleStartDay)}</button>
        <div id="${calId}" style="display:${calOpen?'block':'none'}; margin-bottom:14px;">
          ${renderCalendarPicker('cycleday', g.key, cycleStartDay)}
        </div>
        ${cats.length ? `
        <div class="summary-row" style="margin-bottom:14px;">
          <div class="stat"><div class="label">Budget</div><div class="value">${fmt(groupBudget)}</div></div>
          ${(g.key !== 'rent' && g.key !== 'bills') ? `
          <div class="stat"><div class="label">Spent</div><div class="value ${groupSpent>groupBudget && groupBudget>0?'spend':''}">${fmt(groupSpent)}</div></div>
          <div class="stat"><div class="label">Should have left</div><div class="value">${fmt(shouldHaveLeftStat(groupBudget, pacePercent))}</div></div>
          <div class="stat"><div class="label">Left</div><div class="value ${groupBudget-groupSpent<0?'spend':'grow'}">${fmt(groupBudget-groupSpent)}</div></div>
          ` : ''}
        </div>
        ${catRows}` : `<div class="empty" style="padding:10px 0 18px;"><div class="big">${copy.emptyBig}</div><div class="small">${copy.emptySmall}</div></div>`}
        <button class="add-toggle" data-action="toggle-panel" data-panel="addMonthlyForm-${g.key}">${copy.addLabel}</button>

      budget: groupBudget, spent: groupSpent
    };
  }

  function renderMonthly(){
    const sections = state.monthly.groups.map(g => renderMonthlyGroupSection(g));
    const currentTotals = state.monthly.groups.map(computeGroupCurrentTotals);
    const totalSpentCurrent = currentTotals.reduce((sum,t)=>sum+t.spent, 0);
    const totalBudgetCurrent = currentTotals.reduce((sum,t)=>sum+t.budget, 0);

    const leftover = income - totalSpentCurrent;

    return `

        ${income>0 ? `<div class="stat"><div class="label">Leftover</div><div class="value ${leftover<0?'spend':'grow'}">${fmt(leftover)}</div></div>` : ''}

  // ---------- Savings view (ledger: money in/out per cycle, matching a bank-style tracker) ----------
  function savingsCycleStart(offset){
    return cycleStartForOffset(new Date(), state.savings.cycleStartDay || 1, offset);
  }

  function savingsOffsetOf(cycleKey){
    const nowStart = savingsCycleStart(0);
    const d = parseIso(cycleKey);
    return (d.getFullYear()-nowStart.getFullYear())*12 + (d.getMonth()-nowStart.getMonth());
  }

  // Fills the same value into future cycles only — never touches past months,
  // and never overwrites a future month that already has its own value entered.
  function propagateSavingsValueForward(cycleKey, col, value){
    const editedOffset = savingsOffsetOf(cycleKey);
    const horizon = state.savings.planLength || 18;
    const startOff = Math.max(editedOffset + 1, 0); // never write to anything before today, however far back the edit was
    for(let off = startOff; off <= horizon; off++){
      const futureKey = isoDate(savingsCycleStart(off));
      if(!state.savings.months[futureKey]) state.savings.months[futureKey] = {};
      if(state.savings.months[futureKey][col] === undefined){
        state.savings.months[futureKey][col] = value;
      }
    }
  }

  function savingsNet(monthData){
    const m = monthData || {};
    let net = 0;
    state.savings.columns.forEach(col=>{
      net += (Number(m[col.key])||0) * (col.sign || 1);
    });
    return net;
  }

  function computeSavingsSeries(maxOffsetWanted, minOffsetWanted){
    const keys = Object.keys(state.savings.months||{});
    const nowStart = savingsCycleStart(0);
    let minOffset = Math.min(0, minOffsetWanted || 0);
    keys.forEach(k=>{
      const d = parseIso(k);
      const off = (d.getFullYear()-nowStart.getFullYear())*12 + (d.getMonth()-nowStart.getMonth());
      if(off < minOffset) minOffset = off;
    });
    const maxOffset = Math.max(maxOffsetWanted, 0);

    function hasActualData(key){
      const m = state.savings.months[key];
      return !!(m && Object.keys(m).length > 0);
    }

    // Trailing average of the last (up to) 6 actual months at or before now, used to
    // project future months that haven't been logged yet.
    const actualNets = [];
    for(let off = 0; off >= minOffset && actualNets.length < 6; off--){
      const key = isoDate(savingsCycleStart(off));
      if(hasActualData(key)) actualNets.push(savingsNet(state.savings.months[key]));
    }
    const avgNet = actualNets.length ? actualNets.reduce((a,b)=>a+b,0)/actualNets.length : null;

    let balance = Number(state.savings.startingBalance)||0;
    const series = [];
    for(let off=minOffset; off<=maxOffset; off++){
      const cs = savingsCycleStart(off);
      const key = isoDate(cs);
      const m = state.savings.months[key] || {};
      const actual = hasActualData(key);
      let net, projected = false;
      if(actual){
        net = savingsNet(m);
      } else if(off >= 0 && avgNet !== null){
        net = avgNet;
        projected = true;
      } else {
        net = 0;
      }
      balance += net;
      series.push({ offset: off, key, net, balance, data: m, projected });
    }
    return { series, minOffset, maxOffset, avgNet };
  }

  function renderSavings(){
    const s = state.savings;

    const { series } = computeSavingsSeries(Math.max(displayOffset, s.planLength), displayOffset);

    }

    return `
    <div class="card">
      <h2>Savings tracker</h2>
      <div class="field-row">
        <div class="field">
          <label>Starting balance</label>
          <input type="number" step="0.01" min="0" value="${s.startingBalance || ''}" placeholder="0.00" data-action="set-starting-balance">

          </select>
