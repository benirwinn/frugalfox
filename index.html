      </div>
      <div class="goal-toggle-row">
        <input type="checkbox" id="goalToggle" ${s.goal?'checked':''} data-action="toggle-goal">
        <label for="goalToggle">Set a savings goal</label>
      </div>
      ${s.goal ? `
      <div class="field-row">
        <div class="field">
          <label>Goal amount</label>
          <input type="number" step="0.01" min="0" value="${s.goal.amount || ''}" placeholder="0.00" data-action="set-goal-amount">
        </div>
        <div class="field">
          <label>Target cycle</label>
          <select data-action="set-goal-month">
            ${series.map(x=>`<option value="${x.key}" ${s.goal.targetKey===x.key?'selected':''}>${monthLabelOf(x.key.slice(0,7))}</option>`).join('')}
          </select>
        </div>
      </div>
      ${goalHtml}` : ''}
    </div>

    <div class="card">
      <div class="period-nav">
        <div>
          <span class="period-label">${fmtDayMonthYear(cycleStart)} – ${fmtDayMonthYear(cycleEnd)}</span>
          <span class="period-sub">${displayOffset===0 ? 'Current cycle' : (displayOffset<0 ? `${Math.abs(displayOffset)} cycle(s) ago` : `In ${displayOffset} cycle(s)`)}</span>
        </div>
        <div class="nav-arrows">
          <button class="navbtn" data-action="savings-cycle-prev">‹</button>
          <button class="navbtn" data-action="savings-cycle-today">•</button>
          <button class="navbtn" data-action="savings-cycle-next">›</button>
        </div>
      </div>
      <button class="btn secondary small" data-action="toggle-panel" data-panel="${calId}" style="margin-bottom:14px;">📅 Cycle starts on the ${ordinal(s.cycleStartDay||1)}</button>
      <div id="${calId}" style="display:${calOpen?'block':'none'}; margin-bottom:14px;">
        ${renderCalendarPicker('cycleday', 'savings', s.cycleStartDay||1)}
      </div>
      <div class="savings-ledger">
        ${columnRows}
      </div>
      ${addColHtml}
      <div class="summary-row" style="margin-top:14px;">
        <div class="stat"><div class="label">Saved this cycle</div><div class="value ${netThisCycle<0?'spend':'grow'}">${fmt(netThisCycle)}</div></div>
        <div class="stat"><div class="label">Balance</div><div class="value grow">${fmt(current.balance)}</div></div>
      </div>
      ${current.projected ? `<div class="suggestion">Nothing logged for this cycle yet — the balance above assumes about ${fmt(current.net)} based on your recent average, and will update once you fill in real numbers.</div>` : ''}
    </div>

    <div class="card">
      <h2>Savings over time</h2>
      <div class="chart-wrap">${renderSavingsChartSvg(series)}</div>
      <h3>Quarterly checkpoints</h3>
      ${renderQuarterlyCheckpoints(series)}
      <h3 style="margin-top:16px;">Interest by tax year</h3>
      ${renderInterestByTaxYear(series)}
    </div>
    `;
  }

  function isQuarterEndMonth(d){
    const m = d.getMonth(); // 0-indexed: Mar=2, Jun=5, Sep=8, Dec=11
    return m === 2 || m === 5 || m === 8 || m === 11;
  }

  function cycleShortLabel(key){
    return parseIso(key).toLocaleDateString('en-GB', {month:'short', year:'2-digit'});
  }

  function ukTaxYearStartYear(d){
    const year = d.getFullYear();
    const aprilStart = new Date(year, 3, 6); // 6 April
    return d >= aprilStart ? year : year - 1;
  }
  function ukTaxYearLabel(startYear){
    return `${startYear}–${String(startYear+1).slice(-2)}`;
  }

  function renderInterestByTaxYear(series){
    const totals = {};
    const hasData = {};
    series.forEach(s=>{
      const raw = (s.data||{}).interest;
      if(raw === undefined) return;
      const ty = ukTaxYearStartYear(parseIso(s.key));
      hasData[ty] = true;
      totals[ty] = (totals[ty]||0) + (Number(raw)||0);
    });
    const years = Object.keys(hasData).map(Number).sort((a,b)=>a-b);
    if(!years.length){
      return `<div class="suggestion">Log some interest in the ledger above and your tax-year totals will show up here.</div>`;
    }
    const todayTaxYear = ukTaxYearStartYear(new Date());
    const items = years.map(y=>{
      const label = ukTaxYearLabel(y) + (y === todayTaxYear ? ' (so far)' : '');
      return `<div class="stat"><div class="label">${label} tax year</div><div class="value grow">${fmt(totals[y])}</div></div>`;
    }).join('');
    return `<div class="summary-row" style="flex-wrap:wrap; row-gap:14px;">${items}</div>`;
  }

  function renderQuarterlyCheckpoints(series){
    const checkpoints = series.filter(s => isQuarterEndMonth(parseIso(s.key)));
    if(!checkpoints.length){
      return `<div class="suggestion">Once your plan stretches to a March, June, September or December, your balance at each will show up here.</div>`;
    }
    const anyProjected = checkpoints.some(cp=>cp.projected);
    const items = checkpoints.map(cp=>{
      const label = parseIso(cp.key).toLocaleDateString('en-GB', {month:'long', year:'numeric'});
      const valueColor = cp.projected ? '' : (cp.balance<0?'spend':'grow');
      const style = cp.projected ? 'style="color:#FFB300;"' : '';
      return `<div class="stat"><div class="label">${escapeHtml(label)}${cp.projected?' <span title="Estimated from your recent average — no data logged yet for this cycle">(projected)</span>':''}</div><div class="value ${valueColor}" ${style}>${fmt(cp.balance)}</div></div>`;
    }).join('');
    return `<div class="summary-row" style="flex-wrap:wrap; row-gap:14px;">${items}</div>
    ${anyProjected ? `<div class="suggestion">Projected figures are estimated from your average savings over recent months — log a cycle's actual numbers and they'll update automatically.</div>` : ''}`;
  }

  function renderSavingsChartSvg(series){
    const w = 680, h = 200, padL = 54, padR = 14, padT = 14, padB = 26;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const n = series.length;
    const values = series.map(s=>s.balance);
    const allSame = values.every(v => Math.abs(v - values[0]) < 0.005);
    if(n < 2 || allSame){
      return `<div class="empty" style="padding:30px 10px;"><div class="small">Log a cycle or two in the ledger above and your balance history will chart itself here.</div></div>`;
    }
    let minV = Math.min(0, ...values), maxV = Math.max(...values);
    if(maxV === minV) maxV = minV + 1;
    const range = maxV - minV;
    const stepX = plotW/(n-1);
    const xOf = i => padL + i*stepX;
    const yOf = v => padT + plotH - ((v-minV)/range)*plotH;
    const linePts = series.map((s,i)=>`${xOf(i).toFixed(1)},${yOf(s.balance).toFixed(1)}`).join(' ');
    const areaPts = `${xOf(0).toFixed(1)},${yOf(minV).toFixed(1)} ${linePts} ${xOf(n-1).toFixed(1)},${yOf(minV).toFixed(1)}`;
    const zeroY = yOf(0).toFixed(1);

    const firstProjectedIdx = series.findIndex(s=>s.projected);
    let lineHtml;
    if(firstProjectedIdx === -1){
      lineHtml = `<polyline points="${linePts}" fill="none" stroke="#00B87C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />`;
    } else {
      const solidPts = series.slice(0, firstProjectedIdx+1).map((s,i)=>`${xOf(i).toFixed(1)},${yOf(s.balance).toFixed(1)}`).join(' ');
      const dashedPts = series.slice(firstProjectedIdx).map((s,i)=>{
        const realIdx = firstProjectedIdx + i;
        return `${xOf(realIdx).toFixed(1)},${yOf(s.balance).toFixed(1)}`;
      }).join(' ');
      lineHtml = `
        <polyline points="${solidPts}" fill="none" stroke="#00B87C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
        <polyline points="${dashedPts}" fill="none" stroke="#00B87C" stroke-width="2.5" stroke-dasharray="6,4" stroke-linejoin="round" stroke-linecap="round" />
      `;
    }

    const quarterIdxs = series.map((s,i)=>({i, isQ: isQuarterEndMonth(parseIso(s.key))})).filter(o=>o.isQ).map(o=>o.i);
    let idxs;
    if(quarterIdxs.length >= 2){
      if(quarterIdxs.length > 6){
        const step = (quarterIdxs.length-1)/5;
        idxs = [...new Set(Array.from({length:6}, (_,i)=> quarterIdxs[Math.round(i*step)]))];
      } else {
        idxs = quarterIdxs;
      }
    } else {
      const labelCount = Math.min(n, 6);
      idxs = [...new Set(Array.from({length:labelCount}, (_,i)=> Math.round(i*(n-1)/(labelCount-1||1))))];
    }
    const quarterSet = new Set(quarterIdxs);
    const xLabels = idxs.map(i => `<text x="${xOf(i).toFixed(1)}" y="${h-6}" font-size="9" fill="#93A4C2" text-anchor="middle" font-family="Inter, sans-serif">${cycleShortLabel(series[i].key)}</text>`).join('');
    const dots = idxs.map(i => `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(series[i].balance).toFixed(1)}" r="${quarterSet.has(i)?3.6:2.8}" fill="${quarterSet.has(i)?'#FFB300':'#00B87C'}" ${series[i].projected?'fill-opacity="0.55"':''} />`).join('');
    const yTop = `<text x="${padL-8}" y="${padT+4}" font-size="9" fill="#93A4C2" text-anchor="end" font-family="'IBM Plex Mono', monospace">${fmtCompact(maxV)}</text>`;
    const yBottom = `<text x="${padL-8}" y="${h-padB}" font-size="9" fill="#93A4C2" text-anchor="end" font-family="'IBM Plex Mono', monospace">${fmtCompact(minV)}</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">
      <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#D3E3F7" stroke-width="1" stroke-dasharray="3,3" />
      <polygon points="${areaPts}" fill="#DEF9EC" />
      ${lineHtml}
      ${dots}
      ${yTop}${yBottom}${xLabels}
    </svg>`;
  }

  // ---------- Shared helpers ----------
  function emptyState(big, small){
    return `<div class="card"><div class="empty"><div class="big">${big}</div><div class="small">${small}</div></div></div>`;
  }

  // ---------- Event handling ----------
  mainTabsEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-tab]');
    if(!btn) return;
    state.ui.tab = btn.dataset.tab;
    scheduleSave();
    render();
  });
  subtabsEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-subtab]');
    if(!btn) return;
    state.ui.subtab = btn.dataset.subtab;
    scheduleSave();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    if(!confirm('This will permanently clear all budgets and savings data. Continue?')) return;
    state = defaultState();
    if(currentUser) state.profile.name = currentUser.displayName || '';
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    if(currentUser){
      try{ await setDoc(doc(db, 'trackers', currentUser.uid), { json: JSON.stringify(state), updatedAt: serverTimestamp() }); }
      catch(e){ console.error('Cloud reset failed', e); }
    }
    render();
  });

  mainEl.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;

    if(action === 'week-prev'){ state.ui.weekOffset--; scheduleSave(); render(); }
    else if(action === 'week-next'){ state.ui.weekOffset++; scheduleSave(); render(); }
    else if(action === 'week-today'){ state.ui.weekOffset = 0; scheduleSave(); render(); }
    else if(action === 'group-cycle-prev'){ state.ui.groupOffsets[btn.dataset.group] = groupOffset(btn.dataset.group) - 1; scheduleSave(); render(); }
    else if(action === 'group-cycle-next'){ state.ui.groupOffsets[btn.dataset.group] = groupOffset(btn.dataset.group) + 1; scheduleSave(); render(); }
    else if(action === 'group-cycle-today'){ state.ui.groupOffsets[btn.dataset.group] = 0; scheduleSave(); render(); }
    else if(action === 'savings-cycle-prev'){ state.ui.savingsOffset = (state.ui.savingsOffset||0) - 1; scheduleSave(); render(); }
    else if(action === 'savings-cycle-next'){ state.ui.savingsOffset = (state.ui.savingsOffset||0) + 1; scheduleSave(); render(); }
    else if(action === 'savings-cycle-today'){ state.ui.savingsOffset = 0; scheduleSave(); render(); }

    else if(action === 'toggle-panel'){
      const panel = btn.dataset.panel;
      if(openPanels.has(panel)) openPanels.delete(panel); else openPanels.add(panel);
      render();
    }
    else if(action === 'cancel-edit'){
      openPanels.delete(btn.dataset.panel);
      render();
    }

    else if(action === 'add-weekly-cat'){
      const name = document.getElementById('newWeeklyName').value.trim();
      const budget = parseFloat(document.getElementById('newWeeklyBudget').value) || 0;
      const linkSel = document.getElementById('newWeeklyLink');
      const linkedMonthlyCatId = linkSel && linkSel.value ? linkSel.value : null;
      if(!name) return;
      state.weekly.categories.push({ id: uid(), name, budget, linkedMonthlyCatId });
      openPanels.delete('addWeeklyForm');
      scheduleSave(); render();
    }
    else if(action === 'save-weeklycat-edit'){
      const c = state.weekly.categories.find(x=>x.id===btn.dataset.cat);
      if(c){
        const name = document.getElementById('editName-'+c.id).value.trim();
        const budget = parseFloat(document.getElementById('editBudget-'+c.id).value) || 0;
        const linkSel = document.getElementById('editLink-'+c.id);
        if(name) c.name = name;
        c.budget = budget;
        c.linkedMonthlyCatId = linkSel && linkSel.value ? linkSel.value : null;
      }
      openPanels.delete('edit-weeklycat-'+btn.dataset.cat);
      scheduleSave(); render();
    }
    else if(action === 'add-monthly-cat'){
      const group = btn.dataset.group;
      const name = document.getElementById('newMonthlyName-' + group).value.trim();
      const budget = parseFloat(document.getElementById('newMonthlyBudget-' + group).value) || 0;
      if(!name) return;
      state.monthly.categories.push({ id: uid(), name, budget, group });
      openPanels.delete('addMonthlyForm-'+group);
      scheduleSave(); render();
    }
    else if(action === 'save-monthlycat-edit'){
      const c = findMonthlyCategory(btn.dataset.cat);
      if(c){
        const name = document.getElementById('editName-'+c.id).value.trim();
        const budget = parseFloat(document.getElementById('editBudget-'+c.id).value) || 0;
        if(name) c.name = name;
        c.budget = budget;
      }
      openPanels.delete('edit-monthlycat-'+btn.dataset.cat);
      scheduleSave(); render();
    }
    else if(action === 'delete-weekly-cat'){
      if(!confirm('Remove this category? Its logged amounts will be lost (unless linked to a monthly item, which will keep them).')) return;
      state.weekly.categories = state.weekly.categories.filter(c=>c.id!==btn.dataset.cat);
      scheduleSave(); render();
    }
    else if(action === 'delete-monthly-cat'){
      if(!confirm('Remove this category? Its logged amounts will be lost.')) return;
      const id = btn.dataset.cat;
      state.monthly.categories = state.monthly.categories.filter(c=>c.id!==id);
      delete state.entries[id];
      // unlink any weekly categories pointing at it
      state.weekly.categories.forEach(c=>{ if(c.linkedMonthlyCatId===id) c.linkedMonthlyCatId = null; });
      scheduleSave(); render();
    }
    else if(action === 'save-group-edit'){
      const g = state.monthly.groups.find(x=>x.key===btn.dataset.group);
      if(g){
        const name = document.getElementById('editGroupName-'+g.key).value.trim();
        if(name) g.label = name;
      }
      openPanels.delete('edit-group-'+btn.dataset.group);
      scheduleSave(); render();
    }
    else if(action === 'move-group-up'){
      const groups = state.monthly.groups;
      const i = groups.findIndex(g=>g.key===btn.dataset.group);
      if(i > 0){
        [groups[i-1], groups[i]] = [groups[i], groups[i-1]];
        scheduleSave(); render();
      }
    }
    else if(action === 'move-group-down'){
      const groups = state.monthly.groups;
      const i = groups.findIndex(g=>g.key===btn.dataset.group);
      if(i >= 0 && i < groups.length-1){
        [groups[i], groups[i+1]] = [groups[i+1], groups[i]];
        scheduleSave(); render();
      }
    }
    else if(action === 'delete-monthly-group'){
      if(state.monthly.groups.length <= 1){
        alert("You need at least one section — add another before removing this one.");
        return;
      }
      if(!confirm('Remove this section? Any categories inside it will be removed too.')) return;
      const groupKey = btn.dataset.group;
      state.monthly.groups = state.monthly.groups.filter(g=>g.key!==groupKey);
      const removedIds = state.monthly.categories.filter(c=>c.group===groupKey).map(c=>c.id);
      state.monthly.categories = state.monthly.categories.filter(c=>c.group!==groupKey);
      removedIds.forEach(id=>{
        delete state.entries[id];
        state.weekly.categories.forEach(c=>{ if(c.linkedMonthlyCatId===id) c.linkedMonthlyCatId = null; });
      });
      delete state.ui.groupOffsets[groupKey];
      scheduleSave(); render();
    }
    else if(action === 'add-group'){
      const nameInput = document.getElementById('newGroupName');
      const name = nameInput.value.trim();
      if(!name) return;
      state.monthly.groups.push({ key: uid(), label: name, cycleStartDay: 1 });
      openPanels.delete('addGroupForm');
      scheduleSave(); render();
    }

    else if(action === 'pick-weekday'){
      state.weekly.startDay = parseInt(btn.dataset.value, 10);
      openPanels.delete('weekCal');
      scheduleSave(); render();
    }
    else if(action === 'pick-cycle-day'){
      const gKey = btn.dataset.group;
      if(gKey === 'savings'){
        state.savings.cycleStartDay = parseInt(btn.dataset.value, 10);
        openPanels.delete('savingsCycleCal');
      } else {
        const g = state.monthly.groups.find(gr=>gr.key===gKey);
        if(g) g.cycleStartDay = parseInt(btn.dataset.value, 10);
        openPanels.delete('cycleCal-' + gKey);
      }
      scheduleSave(); render();
    }
    else if(action === 'pick-week-split'){
      const weekKey = btn.dataset.week, catId = btn.dataset.cat;
      if(!state.weekly.splits[weekKey]) state.weekly.splits[weekKey] = {};
      state.weekly.splits[weekKey][catId] = btn.dataset.value;
      openPanels.delete(`weekSplitCal-${weekKey}-${catId}`);
      scheduleSave(); render();
    }
    else if(action === 'remove-week-split'){
      const weekKey = btn.dataset.week, catId = btn.dataset.cat;
      if(!confirm("Remove the split for this category? Its two mini-periods will merge back into one.")) return;
      if(state.weekly.splits[weekKey]) delete state.weekly.splits[weekKey][catId];
      scheduleSave(); render();
    }

    else if(action === 'add-expense'){
      const entryCatId = btn.dataset.entrycat, formId = btn.dataset.form;
      const dateInput = document.getElementById(formId + '-date');
      const noteInput = document.getElementById(formId + '-note');
      const amountInput = document.getElementById(formId + '-amount');
      const amount = parseFloat(amountInput.value);
      if(isNaN(amount) || amount === 0) return;
      const date = dateInput.value || isoDate(new Date());
      if(!state.entries[entryCatId]) state.entries[entryCatId] = [];
      state.entries[entryCatId].push({ id: uid(), date, note: noteInput.value.trim(), amount });
      openPanels.add(formId); // keep the form open so several items can be added quickly
      scheduleSave(); render();
    }
    else if(action === 'delete-expense'){
      const entryCatId = btn.dataset.entrycat, entryId = btn.dataset.entry;
      if(state.entries[entryCatId]){
        state.entries[entryCatId] = state.entries[entryCatId].filter(e=>e.id!==entryId);
      }
      scheduleSave(); render();
    }
    else if(action === 'save-expense-edit'){
      const entryCatId = btn.dataset.entrycat, entryId = btn.dataset.entry;
      const dateInput = document.getElementById('editExpenseDate-'+entryId);
      const noteInput = document.getElementById('editExpenseNote-'+entryId);
      const amountInput = document.getElementById('editExpenseAmount-'+entryId);
      const amount = parseFloat(amountInput.value);
      if(isNaN(amount) || amount === 0) return;
      const list = state.entries[entryCatId];
      const entry = list && list.find(e=>e.id===entryId);
      if(entry){
        entry.date = dateInput.value || entry.date;
        entry.note = noteInput.value.trim();
        entry.amount = amount;
      }
      openPanels.delete(`edit-expense-${entryCatId}-${entryId}`);
      scheduleSave(); render();
    }
    else if(action === 'csv-cancel'){
      delete csvImports[btn.dataset.entrycat];
      render();
    }
    else if(action === 'csv-import'){
      const entryCatId = btn.dataset.entrycat;
      const imp = csvImports[entryCatId];
      if(!imp) return;
      if(!state.entries[entryCatId]) state.entries[entryCatId] = [];
      let count = 0;
      imp.dataRows.forEach(r=>{
        const date = parseCsvDate(r[imp.dateCol]);
        const amtRaw = parseCsvAmount(r[imp.amountCol]);
        if(!date || isNaN(amtRaw) || amtRaw === 0) return;
        if(imp.onlyNegative && !csvIsPurchaseRow(imp, amtRaw)) return;
        const amount = csvEntryAmount(imp, amtRaw);
        const note = imp.noteCol>=0 ? (r[imp.noteCol]||'').trim() : '';
        state.entries[entryCatId].push({ id: uid(), date, note, amount });
        count++;
      });
      delete csvImports[entryCatId];
      scheduleSave(); render();
      alert(count > 0 ? `Imported ${count} transaction(s).` : 'No matching transactions found to import — check the column mapping.');
    }

    else if(action === 'save-savingscol-edit'){
      const col = state.savings.columns.find(c=>c.key===btn.dataset.col);
      if(col){
        const label = document.getElementById('editSavColLabel-'+col.key).value.trim();
        if(label) col.label = label;
      }
      openPanels.delete('edit-savingscol-'+btn.dataset.col);
      scheduleSave(); render();
    }
    else if(action === 'add-savingscol'){
      const nameInput = document.getElementById('newSavColName');
      const signSelect = document.getElementById('newSavColSign');
      const name = nameInput.value.trim();
      if(!name) return;
      state.savings.columns.push({ key: uid(), label: name, sign: parseInt(signSelect.value, 10) });
      openPanels.delete('addSavingsCol');
      scheduleSave(); render();
    }
    else if(action === 'delete-savingscol'){
      if(!confirm('Remove this column from the savings ledger? Any amounts already logged in it will be lost.')) return;
      state.savings.columns = state.savings.columns.filter(c=>c.key!==btn.dataset.col);
      scheduleSave(); render();
    }
    else if(action === 'remove-savings-goal'){
      state.savings.goal = null;
      scheduleSave(); render();
    }
    else if(action === 'repeat-savings-forward'){
      const cycleKey = btn.dataset.cycle, col = btn.dataset.col;
      const value = (state.savings.months[cycleKey]||{})[col];
      if(value === undefined || value === null || value === ''){
        alert('Enter a value in this field first, then repeat it forward.');
        return;
      }
      const colDef = state.savings.columns.find(c=>c.key===col);
      const colLabel = colDef ? colDef.label : col;
      if(!(await customConfirm(`Repeat ${fmt(value)} for "${colLabel}" from today onward? (Nothing before today is ever changed, and any later month you've already filled in yourself won't be overwritten.)`))) return;
      propagateSavingsValueForward(cycleKey, col, value);
      scheduleSave(); render();
    }
  });

  mainEl.addEventListener('change', async (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action === 'set-income'){
      state.monthly.income = parseFloat(el.value) || 0;
      scheduleSave(); render();
    }
    else if(action === 'csv-file-selected'){
      const entryCatId = el.dataset.entrycat;
      const file = el.files && el.files[0];
      if(!file) return;
      file.text().then(text=>{
        const rows = parseCsv(text);
        if(rows.length < 2){ alert("Couldn't find any rows in that file — make sure it's a plain CSV export with a header row."); return; }
        const headers = rows[0];
        const dataRows = rows.slice(1);
        const dateCol = guessCsvColumn(headers, ['date']);
        const amountCol = guessCsvColumn(headers, ['amount', 'value', 'debit', 'money out', 'out']);
        const noteCol = guessCsvColumn(headers, ['description', 'narrative', 'details', 'memo', 'payee', 'reference']);
        csvImports[entryCatId] = {
          headers, dataRows,
          dateCol: dateCol>=0 ? dateCol : 0,
          noteCol: noteCol>=0 ? noteCol : (headers.length>1 ? 1 : 0),
          amountCol: amountCol>=0 ? amountCol : (headers.length>2 ? 2 : headers.length-1),
          onlyNegative: true,
          statementType: 'bank'
        };
        render();
      }).catch(err=>{
        console.error('CSV read failed', err);
        alert("Couldn't read that file — make sure it's a plain CSV export.");
      });
    }
    else if(action === 'csv-set-statementtype'){
      const imp = csvImports[el.dataset.entrycat]; if(imp){ imp.statementType = el.value; render(); }
    }
    else if(action === 'csv-set-datecol'){
      const imp = csvImports[el.dataset.entrycat]; if(imp){ imp.dateCol = parseInt(el.value,10); render(); }
    }
    else if(action === 'csv-set-notecol'){
      const imp = csvImports[el.dataset.entrycat]; if(imp){ imp.noteCol = parseInt(el.value,10); render(); }
    }
    else if(action === 'csv-set-amountcol'){
      const imp = csvImports[el.dataset.entrycat]; if(imp){ imp.amountCol = parseInt(el.value,10); render(); }
    }
    else if(action === 'csv-toggle-negative'){
      const imp = csvImports[el.dataset.entrycat]; if(imp){ imp.onlyNegative = el.checked; render(); }
    }
    else if(action === 'set-split-budget'){
      const weekKey = el.dataset.week, catId = el.dataset.cat, part = el.dataset.part;
      if(!state.weekly.splitBudgets[weekKey]) state.weekly.splitBudgets[weekKey] = {};
      if(!state.weekly.splitBudgets[weekKey][catId]) state.weekly.splitBudgets[weekKey][catId] = {};
      state.weekly.splitBudgets[weekKey][catId][part] = parseFloat(el.value) || 0;
      scheduleSave(); render();
    }
    else if(action === 'set-starting-balance'){
      state.savings.startingBalance = parseFloat(el.value) || 0;
      scheduleSave(); render();
    }
    else if(action === 'set-savings-planlength'){
      state.savings.planLength = parseInt(el.value, 10);
      scheduleSave(); render();
    }
    else if(action === 'set-savings-value'){
      const cycleKey = el.dataset.cycle, col = el.dataset.col;
      if(!state.savings.months[cycleKey]) state.savings.months[cycleKey] = {};
      const previousValue = state.savings.months[cycleKey][col];
      const newValue = parseFloat(el.value) || 0;
      state.savings.months[cycleKey][col] = newValue;
      if(previousValue === undefined && newValue !== 0){
        const colDef = state.savings.columns.find(c=>c.key===col);
        const colLabel = colDef ? colDef.label : col;
        if(await customConfirm(`Repeat ${fmt(newValue)} for "${colLabel}" from today onward? (Nothing before today is ever changed.)`)){
          propagateSavingsValueForward(cycleKey, col, newValue);
        }
      }
      scheduleSave(); render();
    }
    else if(action === 'toggle-goal'){
      if(el.checked){
        const { series } = computeSavingsSeries(state.savings.planLength);
        state.savings.goal = { amount: 0, targetKey: series[series.length-1].key };
      } else {
        state.savings.goal = null;
      }
      scheduleSave(); render();
    }
    else if(action === 'set-goal-amount'){
      state.savings.goal.amount = parseFloat(el.value) || 0;
      scheduleSave(); render();
    }
    else if(action === 'set-goal-month'){
      state.savings.goal.targetKey = el.value;
      scheduleSave(); render();
    }
  });

  // ---------- Welcome / sign-in screen ----------
  const welcomeOverlay = document.getElementById('welcomeOverlay');
  const welcomeContent = document.getElementById('welcomeContent');

  window.addEventListener('error', (e)=>{
    const msg = (e && e.message) ? e.message : 'unknown script error';
    if(welcomeContent) welcomeContent.insertAdjacentHTML('beforeend',
      `<p style="color:#F2523D; font-size:11px; margin-top:10px;">Debug (script error): ${escapeHtml(msg)}</p>`);
  });

  function renderSignIn(errorMsg){
    welcomeContent.innerHTML = `
      <h1>Hello. Welcome to Frugal Fox, your personal spending and savings tracker.</h1>
      <button class="btn full" data-action="sign-in">Sign in with Google</button>
      ${errorMsg ? `<p style="color:#F2523D; font-size:12.5px; margin-top:14px; line-height:1.5;">${escapeHtml(errorMsg)}</p>` : ''}
    `;
    welcomeOverlay.style.display = 'flex';
  }

  function renderWelcomeSplash(){
    welcomeContent.innerHTML = `
      <h1>Welcome to your spending and savings tracker, ${escapeHtml(state.profile.name)}</h1>
      <button class="btn full" data-action="enter-app">Enter my tracker →</button>
      <button class="change-name" data-action="sign-out">Sign out</button>
    `;
    welcomeOverlay.style.display = 'flex';
  }

  welcomeOverlay.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    if(action === 'sign-in'){
      try{
        await signInWithPopup(auth, googleProvider);
        // onAuthStateChanged below takes it from here
      }catch(err){
        console.error('Sign-in failed', err);
        const code = err && err.code ? err.code : '';
        let msg;
        if(code === 'auth/popup-blocked'){
          msg = "Your browser blocked the sign-in popup. Look for a blocked-popup icon at the right of your address bar, allow popups for this site, then try again.";
        } else if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
          msg = "The sign-in window closed before finishing — give it another try and keep the popup open until it's done.";
        } else {
          msg = "Sign-in error: " + (code || 'unknown') + (err && err.message ? ' — ' + err.message : '');
        }
        renderSignIn(msg);
      }
    }
    else if(action === 'enter-app'){
      welcomeOverlay.style.display = 'none';
    }
    else if(action === 'sign-out'){
      await signOut(auth);
    }
  });

  // ---------- Init ----------
  function updateTopbarHeightVar(){
    const topbar = document.querySelector('.topbar');
    if(topbar) document.documentElement.style.setProperty('--topbar-height', topbar.offsetHeight + 'px');
  }
  window.addEventListener('resize', updateTopbarHeightVar);
  setTimeout(updateTopbarHeightVar, 0);

  mainTabsEl.innerHTML = `<button class="tab" data-tab="spending">Spending</button><button class="tab" data-tab="savings">Savings</button>`;
  updateTopbarHeightVar();
  renderSignIn();

  onAuthStateChanged(auth, async (user)=>{
    if(user){
      currentUser = user;
      state = await loadStateForUser(user.uid);
      if(!state.profile.name) state.profile.name = user.displayName || 'there';
      updateTopbarHeightVar();
      render();
      renderWelcomeSplash();
    } else {
      currentUser = null;
      renderSignIn();
    }

  });

})();

</script>
</body>
</html>
